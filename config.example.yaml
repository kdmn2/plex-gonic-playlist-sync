# Example configuration. Copy to /config/config.yaml (or set PLAYLIST_SYNC_CONFIG_FILE).
# Environment variables override values here; *_FILE variants override secrets.

data_dir: /data
config_dir: /config
log_level: INFO
log_http: false

plex:
  url: http://plex:32400
  token: ""            # prefer PLAYLIST_SYNC_PLEX__TOKEN_FILE
  token_file: null     # optional: path to a file containing the token
  verify_tls: true
  ca_bundle: null
  timeout: 30
  # Scope Plex playlist discovery to these music libraries (names or keys).
  library_sections: ["Music"]

gonic:
  url: http://gonic:4747
  username: admin
  password: ""         # prefer PLAYLIST_SYNC_GONIC__PASSWORD_FILE
  verify_tls: true
  ca_bundle: null
  timeout: 30
  music_folder_id: null
  use_token_auth: true

sync:
  poll_seconds: 300            # 0 disables the scheduler
  duration_tolerance_ms: 2000
  block_on_unmatched: true
  allow_partial: false         # global opt-in to skip unmatched tracks
  delete_target_playlist: false
  allow_clear_target_when_source_empty: false
  append_chunk_size: 1000
  max_retries: 3
  retry_backoff_seconds: 2.0
  # Map the same file tree as each server sees it. Anchored (path-segment) matching.
  path_roots:
    - name: music
      plex_root: /data/music
      gonic_root: /music

resilience:
  retry_attempts: 3
  retry_base_seconds: 1.0
  retry_max_seconds: 30.0
  retry_total_seconds: 60.0
  respect_retry_after: true
  retry_after_max_seconds: 120.0
  circuit_failure_threshold: 5
  circuit_reset_seconds: 60.0

limits:
  max_response_bytes: 67108864      # 64 MiB
  max_playlist_entries: 100000
  max_pages: 10000
  max_page_repeats: 3
  max_run_seconds: 1800
  max_concurrent_tasks: 4
  min_free_bytes: 67108864          # refuse writes below 64 MiB free
  runs_retention: 500
  snapshots_retention: 200

logging:
  directory: null                   # defaults to <data_dir>/logs
  max_bytes: 5242880                # 5 MiB per file
  backups: 3
  dedupe_window_seconds: 60.0

backups:
  enabled: true
  directory: /backups                # must be a mounted, writable container path
  path_mode: server                  # server | mapped | relative
  relative_base: null                # used by 'relative' mode
  mappings:                          # export path rules (distinct from sync.path_roots)
    - server: gonic
      from_root: /music
      to_root: /export/music
  require_all_entries: true          # block a playlist if any entry has no path
  retention: 0                       # 0 = keep every version (retention not implemented)

ui:
  enabled: true
  username: admin
  password: ""         # REQUIRED for `serve`; prefer PLAYLIST_SYNC_UI__PASSWORD_FILE
  session_secret: ""   # optional; derived if empty
  base_url: http://localhost:8080
