services:
  playlist-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: plex-gonic-playlist-sync:local
    container_name: playlist-sync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Unraid appdata is typically owned by nobody:users (99:100).
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./appdata/plex-gonic-sync/config:/config
      - ./appdata/plex-gonic-sync/data:/data
      # Playlist (M3U) backups; set Settings -> Playlist backups directory to /backups.
      - ./appdata/plex-gonic-sync/backups:/backups
    ports:
      - "8080:8080"
    # Read-only root filesystem is supported; only /config, /data and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # The entrypoint needs these to chown appdata and drop to PUID/PGID, then the
    # app runs with no capabilities. Dropping ALL would break setuid.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    # No Docker socket, no privileged mode, no host networking.
    #
    # Join an existing Docker network so service names like "plex" and "gonic"
    # resolve (see README). Uncomment and set the external network name:
    # networks:
    #   - plexnet
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

