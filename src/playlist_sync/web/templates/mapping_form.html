{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>New mapping</h2>
  <p class="muted">Names are labels; mappings use persistent playlist IDs. Ambiguous same-name playlists are
  never paired automatically.</p>
  <form method="post" action="/mappings">
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <p><label>Mapping name<br><input name="name" required style="min-width:320px"></label></p>
    <p><label>Direction<br>
      <select name="direction">
        {% for d in directions %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
      </select>
    </label></p>
    <p><label>Plex playlist<br>
      {% if plex_playlists %}
      <select name="plex_playlist_id" style="min-width:320px">
        <option value="">— select —</option>
        {% for p in plex_playlists %}<option value="{{ p.playlist_id }}">{{ p.name }} — {{ p.track_count }} tracks{% if p.is_smart %} (smart){% endif %}</option>{% endfor %}
      </select>
      {% else %}<input name="plex_playlist_id" style="min-width:320px" placeholder="playlist id">{% endif %}
    </label></p>
    <p><label>Gonic playlist<br>
      {% if gonic_playlists %}
      <select name="gonic_playlist_id" style="min-width:320px">
        <option value="">— select —</option>
        {% for p in gonic_playlists %}<option value="{{ p.playlist_id }}">{{ p.name }} — {{ p.track_count }} tracks</option>{% endfor %}
      </select>
      {% else %}<input name="gonic_playlist_id" style="min-width:320px" placeholder="playlist id">{% endif %}
    </label></p>
    <p><label>Bidirectional baseline (only used for bidirectional)<br>
      <select name="baseline_mode">
        {% for b in baselines %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
      </select>
    </label></p>
    <p><label><input type="checkbox" name="allow_partial"> Allow partial sync (skip unmatched tracks — opt-in only)</label></p>
    <button type="submit">Create mapping</button>
  </form>
</div>
{% endblock %}
