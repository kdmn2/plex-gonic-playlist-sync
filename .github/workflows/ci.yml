name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t plex-gonic-playlist-sync:ci .
      - name: Smoke test health endpoint
        run: |
          docker run -d --name pgs-ci -e PLAYLIST_SYNC_UI__PASSWORD=ci -e PLAYLIST_SYNC_SYNC__POLL_SECONDS=0 -p 18080:8080 plex-gonic-playlist-sync:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/healthz
          docker rm -f pgs-ci
