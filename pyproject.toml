[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "plex-gonic-playlist-sync"
version = "0.1.0"
description = "Self-hosted, API-only playlist synchroniser between Plex and Gonic."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "plex-gonic-playlist-sync contributors" }]
keywords = ["plex", "gonic", "subsonic", "playlist", "sync", "self-hosted"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "PlexAPI>=4.15,<5",
  "httpx>=0.27,<1",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6.0,<7",
  "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.9",
  # Used directly by the Plex client (via python-plexapi's session).
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
playlist-sync = "playlist_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/playlist_sync"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",
  # str-based enums are intentional and used with .value everywhere.
  "UP042",
  # en dashes in user-facing strings/docstrings are intentional.
  "RUF001",
  "RUF002",
  # optional no-op close() in an ABC is deliberate.
  "B027",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: opt-in tests that talk to real, explicitly designated servers",
]
